[Service]
# Target the AMD dGPU (Navi 33 / RX 7600) for inference.
# HSA_OVERRIDE_GFX_VERSION is required for gfx1102 (Navi 33) ROCm compatibility.
# HIP_VISIBLE_DEVICES=0 selects the dGPU over the integrated Radeon 880M.
Environment="HSA_OVERRIDE_GFX_VERSION=11.0.0"
Environment="HIP_VISIBLE_DEVICES=0"

# Default context window for all models (128k tokens).
# The model weights (~6GB) sit on the 8GB dGPU VRAM; the KV cache spills to
# system RAM. At 128k context this uses roughly 30-40GB of system memory
# depending on the model.
Environment="OLLAMA_NUM_CTX=131072"

# Keep only one model loaded at a time to maximise available memory.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
